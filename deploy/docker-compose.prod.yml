name: onebeat-prod

services:
  onebeat-prod:
    image: "${ONEBEAT_IMAGE:-ghcr.io/1173774897/onebeatbackend:prod}"
    container_name: onebeat-prod
    restart: unless-stopped
    init: true
    ports:
      - "443:8443"
    env_file:
      - path: ./.env.prod
        required: true
      - path: ./secrets/prod.env
        required: false
    environment:
      APP_ENV: "prod"
      STORE_API_ADDR: ":8443"
      STORE_API_TLS_CERT: "/certs/fullchain.pem"
      STORE_API_TLS_KEY: "/certs/privkey.pem"
      STORE_SECRETS_DIR: "/run/secrets"
    volumes:
      - ./certs/prod:/certs:ro
      - ./data/prod:/data
      - ./secrets/prod:/run/secrets:ro
    networks:
      - onebeat-backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: migrate/migrate:v4.19.1
    profiles:
      - migration
    restart: "no"
    env_file:
      - ./.env.prod
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - 'exec migrate -path=/migrations -database "$$DATABASE_URL" up'
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - onebeat-backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  onebeat-backend:
    external: true
    name: onebeat-backend
