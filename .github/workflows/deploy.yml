name: Build and deploy oneBeat

on:
  push:
    branches:
      - master
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 1173774897/onebeatbackend
  DEPLOY_ROOT: /opt/onebeatbackend

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_env: ${{ steps.release.outputs.app_env }}
      compose_file: ${{ steps.release.outputs.compose_file }}
      environment: ${{ steps.release.outputs.environment }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      image_pull_ref: ${{ steps.image_ref.outputs.pull_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select release target
        id: release
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_NAME" == "master" ]]; then
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
            echo "compose_file=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=test" >> "$GITHUB_OUTPUT"
            echo "compose_file=docker-compose.test.yml" >> "$GITHUB_OUTPUT"
            echo "environment=testing" >> "$GITHUB_OUTPUT"
            echo "image_tag=test" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      # docker-container driver pulls moby/buildkit from Docker Hub; some runners resolve
      # registry-1.docker.io to a bad IP. Use the host engine's embedded BuildKit instead.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_ENV=${{ steps.release.outputs.app_env }}
            APP_VERSION=${{ steps.release.outputs.short_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Aliyun ACR (personal / some editions) rejects BuildKit attestations that use
          # application/vnd.oci.empty.v1+json; imagetools copy then fails with 403 on mirror.
          provenance: false
          sbom: false

      # `if:` cannot reference `secrets.*` (workflow parser rejects it). Use a step output instead.
      - name: Detect Aliyun ACR mirror
        id: acr_mirror
        env:
          ACR_PREFIX: ${{ secrets.ALIYUN_ACR_IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          if [[ -n "${ACR_PREFIX}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Mainland ECS: pulling from ghcr.io is slow / TLS-timeout prone. Optional: copy tag to Aliyun ACR after GHCR push.
      - name: Aliyun ACR — registry host (optional)
        id: acr
        if: ${{ steps.acr_mirror.outputs.enabled == 'true' }}
        env:
          ACR_PREFIX: ${{ secrets.ALIYUN_ACR_IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          echo "registry_host=${ACR_PREFIX%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to Aliyun ACR (optional)
        if: ${{ steps.acr_mirror.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry_host }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Mirror image to Aliyun ACR (optional)
        if: ${{ steps.acr_mirror.outputs.enabled == 'true' }}
        env:
          ACR_PREFIX: ${{ secrets.ALIYUN_ACR_IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.image_tag }}"
          SRC="ghcr.io/${{ env.IMAGE_NAME }}:${TAG}"
          DST="${ACR_PREFIX}:${TAG}"
          docker buildx imagetools create --tag "$DST" "$SRC"

      - name: Image reference for deploy
        id: image_ref
        env:
          ACR_PREFIX: ${{ secrets.ALIYUN_ACR_IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.image_tag }}"
          if [[ -n "${ACR_PREFIX}" ]]; then
            echo "pull_ref=${ACR_PREFIX}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "pull_ref=ghcr.io/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to server
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ needs.build.outputs.environment }}
    concurrency:
      # Production and testing share one PostgreSQL container and deployment directory.
      group: onebeat-server-deploy
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: onebeat
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Prepare deployment directories
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "rm -rf '$DEPLOY_ROOT/migrations.next' && install -d -m 755 '$DEPLOY_ROOT' '$DEPLOY_ROOT/migrations' '$DEPLOY_ROOT/migrations.next' '$DEPLOY_ROOT/postgres/init'"

      - name: Upload deployment configuration and migrations
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy/${{ needs.build.outputs.compose_file }}" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/${{ needs.build.outputs.compose_file }}.next"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy/docker-compose.database.yml" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/docker-compose.database.yml.next"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy/postgres/init/01-create-environment-databases.sh" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/postgres/init/01-create-environment-databases.sh.next"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            migrations/*.sql \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/migrations.next/"

      - name: Pull and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "
              set -eu
              mv '$DEPLOY_ROOT/${{ needs.build.outputs.compose_file }}.next' '$DEPLOY_ROOT/${{ needs.build.outputs.compose_file }}'
              mv '$DEPLOY_ROOT/docker-compose.database.yml.next' '$DEPLOY_ROOT/docker-compose.database.yml'
              mv '$DEPLOY_ROOT/postgres/init/01-create-environment-databases.sh.next' '$DEPLOY_ROOT/postgres/init/01-create-environment-databases.sh'
              chmod 755 '$DEPLOY_ROOT/postgres/init/01-create-environment-databases.sh'
              # Replace the whole directory: scp only adds files, and a migration
              # removed from the branch must not linger and be applied later.
              rm -rf '$DEPLOY_ROOT/migrations.prev'
              mv '$DEPLOY_ROOT/migrations' '$DEPLOY_ROOT/migrations.prev'
              mv '$DEPLOY_ROOT/migrations.next' '$DEPLOY_ROOT/migrations'
              rm -rf '$DEPLOY_ROOT/migrations.prev'
              test -s '$DEPLOY_ROOT/.env.database' || {
                echo 'Missing $DEPLOY_ROOT/.env.database; create the server-side database secrets first.' >&2
                exit 1
              }
              test -s '$DEPLOY_ROOT/.env.${{ needs.build.outputs.app_env }}' || {
                echo 'Missing $DEPLOY_ROOT/.env.${{ needs.build.outputs.app_env }}; create the environment DATABASE_URL first.' >&2
                exit 1
              }
              export ONEBEAT_IMAGE='${{ needs.build.outputs.image_pull_ref }}'
              case \"\$ONEBEAT_IMAGE\" in
                ghcr.io/*) ;;
                *)
                  REG=\"\${ONEBEAT_IMAGE%%/*}\"
                  printf '%s\\n' '${{ secrets.ALIYUN_ACR_PASSWORD }}' | docker login \"\$REG\" -u '${{ secrets.ALIYUN_ACR_USERNAME }}' --password-stdin
                  ;;
              esac
              # Pull only images that resolve cleanly through mainland mirrors. The migrate
              # image is docker.io/migrate/migrate; some mirrors return 403 for it, so we
              # keep it locally (pull_policy if_not_present in compose) or load it once.
              docker compose -f '$DEPLOY_ROOT/docker-compose.database.yml' pull postgres
              docker compose -f '$DEPLOY_ROOT/docker-compose.database.yml' up -d --wait --wait-timeout 90
              case '${{ needs.build.outputs.compose_file }}' in
                docker-compose.test.yml) ONEBEAT_SVC=onebeat-test ;;
                docker-compose.prod.yml) ONEBEAT_SVC=onebeat-prod ;;
                *) echo 'Unknown compose file for pull' >&2; exit 1 ;;
              esac
              # \$ escapes the runner's shell — ONEBEAT_SVC must expand on the server after case, not on GitHub.
              docker compose -f '$DEPLOY_ROOT/${{ needs.build.outputs.compose_file }}' --profile migration pull \$ONEBEAT_SVC
              docker compose -f '$DEPLOY_ROOT/${{ needs.build.outputs.compose_file }}' --profile migration run --rm migrate
              docker compose -f '$DEPLOY_ROOT/${{ needs.build.outputs.compose_file }}' up -d --remove-orphans --wait --wait-timeout 60
            "
